<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vox Reader</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0c0a;
    --surface: #1a1714;
    --surface2: #231f1b;
    --border: #2e2924;
    --text: #e8e0d4;
    --text-muted: #8a7f74;
    --accent: #c8956b;
    --accent2: #d4a67a;
    --hl-word: #f0a870;
    --hl-sentence: rgba(200,149,107,0.13);
    --radius: 12px;
    --tr: 0.2s ease;
    --header-h: 52px;
  }
  .theme-light {
    --bg: #f4efe8; --surface: #fffcf7; --surface2: #ede8e0;
    --border: #d8cfc4; --text: #2a2420; --text-muted: #8a7f74;
    --accent: #b5743e; --accent2: #c47f42;
    --hl-word: #a0581e; --hl-sentence: rgba(181,116,62,0.1);
  }
  .theme-sepia {
    --bg: #2a2218; --surface: #322919; --surface2: #3c3121;
    --border: #4a3e2c; --text: #e8d8bc; --text-muted: #9a8860;
    --accent: #d4a060; --accent2: #e0b070;
    --hl-word: #f0b870; --hl-sentence: rgba(212,160,96,0.15);
  }
  .theme-slate {
    --bg: #0d1117; --surface: #161b22; --surface2: #21262d;
    --border: #30363d; --text: #e6edf3; --text-muted: #7d8590;
    --accent: #58a6ff; --accent2: #79c0ff;
    --hl-word: #79c0ff; --hl-sentence: rgba(88,166,255,0.1);
  }
  .theme-forest {
    --bg: #0b1a0b; --surface: #112011; --surface2: #182d18;
    --border: #2a4a2a; --text: #d0e8d0; --text-muted: #6a966a;
    --accent: #5cb85c; --accent2: #78cc78;
    --hl-word: #78cc78; --hl-sentence: rgba(92,184,92,0.12);
  }
  .theme-ocean {
    --bg: #060f1c; --surface: #0c1b30; --surface2: #112440;
    --border: #1a3558; --text: #c8dff8; --text-muted: #5a88b8;
    --accent: #4ca8e0; --accent2: #68bce8;
    --hl-word: #68bce8; --hl-sentence: rgba(76,168,224,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Lora', Georgia, serif;
    background: var(--bg);
    color: var(--text);
    transition: background var(--tr), color var(--tr);
    padding-top: var(--header-h);
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }

  /* ── HEADER ────────────────────────────── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 300;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem; font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
  }
  .logo span { color: var(--text-muted); font-style: italic; font-weight: 400; }

  .header-left { display: flex; align-items: center; gap: 10px; }
  .hamburger-btn {
    background: none; border: none;
    color: var(--text); font-size: 1.4rem;
    cursor: pointer; padding: 2px 4px;
    display: flex; align-items: center;
    -webkit-appearance: none;
  }
  .hamburger-btn:active { color: var(--accent); }

  .header-right { display: flex; align-items: center; gap: 8px; }

  .rsvp-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem; letter-spacing: 0.05em;
    color: var(--text-muted); text-decoration: none;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 7px;
  }

  .theme-switcher { display: flex; gap: 4px; }
  .theme-btn {
    width: 17px; height: 17px; border-radius: 50%;
    border: 2px solid var(--border); cursor: pointer;
    transition: border-color var(--tr);
  }
  .theme-btn.dark   { background: #1a1714; }
  .theme-btn.light  { background: #f4efe8; }
  .theme-btn.sepia  { background: #322919; }
  .theme-btn.slate  { background: #161b22; }
  .theme-btn.forest { background: #112011; }
  .theme-btn.ocean  { background: #0c1b30; }
  .theme-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(200,149,107,0.4); }

  .font-controls { display: flex; gap: 4px; }
  .font-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); width: 27px; height: 27px;
    border-radius: 7px; cursor: pointer; font-size: 0.75rem;
    display: flex; align-items: center; justify-content: center;
  }
  .font-btn:active { background: var(--accent); color: #fff; }

  /* ── LIBRARY ────────────────────────────── */
  .lib-search, .meta-input {
    width: 100%; padding: 9px 12px;
    background: var(--surface2); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 9px;
    font-family: 'Lora', serif; font-size: 0.9rem; outline: none;
    -webkit-appearance: none;
  }
  .lib-search { margin-bottom: 12px; }
  .lib-search:focus, .meta-input:focus { border-color: var(--accent); }
  .lib-search::placeholder, .meta-input::placeholder { color: var(--text-muted); font-style: italic; }
  .meta-input { margin-bottom: 8px; }
  .lib-empty { color: var(--text-muted); font-size: 0.8rem; font-style: italic; padding: 4px 2px; }

  .grp { margin-bottom: 10px; }
  .grp-head {
    display: flex; align-items: center; gap: 6px; width: 100%;
    background: none; border: none; padding: 4px 2px 6px;
    color: var(--text-muted); cursor: pointer; text-align: left;
    font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    -webkit-appearance: none;
  }
  .grp-head:hover { color: var(--text); }
  .grp-caret { display: inline-block; transition: transform var(--tr); }
  .grp.collapsed .grp-caret { transform: rotate(-90deg); }
  .grp.collapsed .lib-row { display: none; }
  .grp-count { margin-left: auto; opacity: 0.7; }

  .lib-row { display: flex; flex-direction: column; gap: 7px; }
  .book-chip {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 9px; padding: 7px 10px;
    font-size: 0.8rem; cursor: pointer; max-width: 100%;
    transition: border-color var(--tr);
  }
  .book-chip:hover { border-color: var(--text-muted); }
  .book-chip.active { border-color: var(--accent); color: var(--accent); }
  .chip-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .chip-pct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem; color: var(--text-muted); flex-shrink: 0;
  }
  .chip-more {
    background: none; border: none; color: var(--text-muted);
    font-size: 1rem; line-height: 1; padding: 0 4px; flex-shrink: 0;
    cursor: pointer; -webkit-appearance: none;
  }
  .chip-more:hover { color: var(--text); }
  .chip-edit {
    background: var(--surface2); border: 1.5px solid var(--accent);
    border-radius: 9px; padding: 10px; margin-top: -2px;
  }
  .chip-edit-btns { display: flex; gap: 6px; }
  .chip-edit-btns button {
    flex: 1; padding: 7px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-family: 'Lora', serif; font-size: 0.8rem;
    -webkit-appearance: none;
  }
  .chip-edit-btns .save { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip-edit-btns .del { color: #e05c5c; flex: 0 0 auto; padding: 7px 12px; }

  /* ── DRAWER ────────────────────────────── */
  .drawer-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 400;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 85vw; max-width: 420px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    z-index: 500;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .drawer-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem; font-weight: 600;
    color: var(--accent);
  }
  .drawer-close {
    background: none; border: none;
    color: var(--text-muted); font-size: 1.2rem;
    cursor: pointer; padding: 4px 8px;
    -webkit-appearance: none;
  }
  .drawer-close:active { color: var(--text); }

  .drawer-body {
    flex: 1 1 auto; min-height: 0;
    padding: 14px 16px 24px;
    overflow-x: hidden; overflow-y: auto;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }

  .new-btn {
    width: 100%; padding: 12px;
    background: var(--surface2);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    color: var(--accent); font-family: 'Lora', serif;
    font-size: 0.95rem; cursor: pointer;
    margin-bottom: 14px;
    transition: border-color var(--tr), background var(--tr);
    -webkit-appearance: none;
  }
  .new-btn:active { border-color: var(--accent); border-style: solid; background: var(--surface); }

  .drawer-divider {
    height: 1px; background: var(--border);
    margin: 14px 0;
  }


  #textInput {
    width: 100%; height: 110px;
    min-height: 80px; max-height: 70vh;
    background: var(--surface2);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text); font-family: 'Lora', serif;
    font-size: 1rem; line-height: 1.6;
    padding: 12px 14px; resize: vertical; outline: none;
    -webkit-appearance: none;
  }
  #textInput:focus { border-color: var(--accent); border-style: solid; }
  #textInput::placeholder { color: var(--text-muted); font-style: italic; }

  .load-btn {
    margin-top: 10px; width: 100%; padding: 13px;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); font-family: 'Playfair Display', serif;
    font-size: 1.05rem; font-weight: 600; cursor: pointer;
    transition: background var(--tr);
    -webkit-appearance: none;
  }
  .load-btn:active { background: var(--accent2); }

  /* ── READER PANE ───────────────────────── */
  .reader-wrap { padding: 12px 16px 0; }
  #readerPane {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    height: 60vh; height: 60dvh;
    position: relative;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    line-height: 1.85;
    font-size: 17px;
    transition: background var(--tr);
  }
  #readerPane::-webkit-scrollbar { display: none; }

  .reader-empty {
    color: var(--text-muted); font-style: italic;
    text-align: center; padding: 40px 0;
    font-size: 0.95rem;
  }
  .para { margin-bottom: 0.8em; white-space: pre-wrap; }
  .para:last-child { margin-bottom: 0; }

  .progress-track {
    height: 2px; background: var(--border);
    border-radius: 2px; margin: 8px 16px 0;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    transition: width 0.3s; width: 0%; border-radius: 2px;
  }

  .progress-meta {
    display: flex; justify-content: space-between;
    padding: 4px 16px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; color: var(--text-muted);
  }

  /* Word / sentence highlighting */
  .word { cursor: pointer; border-radius: 3px; padding: 0 1px; }
  .word.active-word { color: var(--hl-word); font-weight: 600; }
  .sentence { border-radius: 3px; }
  .sentence.active-sentence { background: var(--hl-sentence); }

  /* Quick actions */
  .quick-actions { display: flex; gap: 8px; padding: 10px 16px 0; }
  .qa-btn {
    flex: 1; height: 44px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text); font-size: 0.88rem;
    font-family: 'Lora', serif;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 6px;
    transition: border-color var(--tr), background var(--tr);
    -webkit-appearance: none;
  }
  .qa-btn:active { border-color: var(--accent); background: var(--surface); }

  /* ── CONTROLS BAR ──────────────────────── */
  .controls-bar { padding: 10px 16px 4px; }

  .playback-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .pb-btn {
    flex: 1; height: 52px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2); color: var(--text);
    font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--tr);
    -webkit-appearance: none;
  }
  .pb-btn:active { background: var(--border); }
  .pb-btn.play-btn {
    flex: 2; background: var(--accent);
    border-color: var(--accent); color: #fff;
    font-size: 1.5rem;
  }
  .pb-btn.play-btn:active { background: var(--accent2); }
  .pb-btn.play-btn.playing { background: #7a4828; border-color: #7a4828; }

  .status-row {
    display: flex; align-items: center; gap: 7px;
    margin-bottom: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem; color: var(--text-muted);
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted); flex-shrink: 0;
  }
  .status-dot.playing { background: #6dbf7c; animation: pulse 1.2s infinite; }
  .status-dot.paused  { background: var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

  .sliders-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 10px;
  }
  .slider-lbl {
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; color: var(--text-muted); margin-bottom: 5px;
  }
  .slider-lbl strong { color: var(--text); }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 4px;
    border-radius: 4px; background: var(--border); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: var(--accent);
    border: 2px solid var(--bg); box-shadow: 0 0 0 2px var(--accent);
  }
  input[type=range]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
  }

  /* ── VOICE SECTION ─────────────────────── */
  .voice-section { padding: 0 16px 16px; }
  .voice-section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-muted);
    padding: 12px 0 8px;
    border-top: 1px solid var(--border);
  }

  .voice-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  @media (max-width: 380px) { .voice-grid { grid-template-columns: 1fr 1fr; } }
  .voice-option {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 9px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    transition: border-color var(--tr), background var(--tr);
    -webkit-tap-highlight-color: transparent;
  }
  .voice-option:active { background: var(--surface); }
  .voice-option.selected {
    border-color: var(--accent);
    background: rgba(200,149,107,0.1);
  }
  .voice-option.unavailable { opacity: 0.45; }
  .voice-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
  }
  .voice-info { min-width: 0; }
  .voice-name { font-size: 0.82rem; font-weight: 500; color: var(--text); }
  .voice-tag {
    font-size: 0.55rem; font-family: 'JetBrains Mono', monospace;
    padding: 1px 0; border-radius: 4px;
    color: var(--text-muted);
    text-transform: uppercase; display: block; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .voice-note {
    font-size: 0.72rem; color: var(--text-muted);
    font-style: italic; margin-top: 8px;
  }
</style>
</head>
<body>

<!-- FIXED HEADER -->
<header>
  <div class="header-left">
    <button class="hamburger-btn" onclick="toggleDrawer()">☰</button>
    <div class="logo">Vox <span>Reader</span></div>
  </div>
  <div class="header-right">
    <div class="font-controls">
      <button class="font-btn" onclick="changeFontSize(-1)">A−</button>
      <button class="font-btn" onclick="changeFontSize(1)">A+</button>
    </div>
    <div class="theme-switcher">
      <div class="theme-btn dark"   onclick="setTheme('dark',this)"></div>
      <div class="theme-btn light"  onclick="setTheme('light',this)"></div>
      <div class="theme-btn sepia"  onclick="setTheme('sepia',this)"></div>
      <div class="theme-btn slate"  onclick="setTheme('slate',this)"></div>
      <div class="theme-btn forest" onclick="setTheme('forest',this)"></div>
      <div class="theme-btn ocean"  onclick="setTheme('ocean',this)"></div>
    </div>
    <a class="rsvp-link" href="rsvp-reader.html?v=5">RSVP</a>
  </div>
</header>

<!-- LIBRARY DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">Library</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body">
    <button class="new-btn" onclick="newEntry()">+ New</button>
    <input id="libSearch" class="lib-search" type="search" placeholder="Search titles, groups, text…" oninput="renderLibrary()" autocomplete="off">
    <div id="libList"></div>
    <datalist id="groupList"></datalist>
    <div class="drawer-divider"></div>
    <input id="titleInput" class="meta-input" placeholder="Title (optional — defaults to first line)" autocomplete="off">
    <input id="groupInput" class="meta-input" list="groupList" placeholder="Group (optional)" autocomplete="off">
    <textarea id="textInput" placeholder="Paste your text here, then tap Load…" spellcheck="false"></textarea>
    <button class="load-btn" onclick="loadText()">Load Text →</button>
  </div>
</div>

<!-- READER PANE -->
<div class="reader-wrap">
  <div id="readerPane">
    <div class="reader-empty">Tap + New to paste text, or ☰ to open your library.</div>
  </div>
</div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="progress-meta"><span id="wordCount">0 words</span><span id="readTime">~0 min</span></div>

<div class="quick-actions">
  <button class="qa-btn" onclick="openDrawer()">📚 Library</button>
  <button class="qa-btn" onclick="newEntry()">+ New</button>
</div>

<!-- CONTROLS BAR -->
<div class="controls-bar">

  <div class="playback-row">
    <button class="pb-btn" onclick="restartBook()" title="Restart">⟪</button>
    <button class="pb-btn" onclick="skipSentence(-1)" title="Previous sentence">◀</button>
    <button class="pb-btn play-btn" id="playBtn" onclick="togglePlay()">▶</button>
    <button class="pb-btn" onclick="skipSentence(1)" title="Next sentence">▶▶</button>
  </div>

  <div class="status-row">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Ready</span>
  </div>

  <div class="sliders-row">
    <div class="slider-block">
      <div class="slider-lbl">
        <span>Speed</span><strong id="speedVal">1.0×</strong>
      </div>
      <input type="range" id="speedSlider" min="0.5" max="3" step="0.1" value="1"
             oninput="updateSpeedDisplay(this.value)" onchange="updateSpeedCommit(this.value)">
    </div>
    <div class="slider-block">
      <div class="slider-lbl">
        <span>Position</span><strong id="posVal">0%</strong>
      </div>
      <input type="range" id="posSlider" min="0" max="100" step="1" value="0"
             oninput="seekPositionDisplay(this.value)" onchange="seekPositionCommit(this.value)">
    </div>
  </div>

</div>

<!-- VOICE SECTION -->
<div class="voice-section">
  <div class="voice-section-label">Voice</div>
  <div class="voice-grid" id="voiceGrid"></div>
  <div class="voice-note" id="voiceNote" style="display:none"></div>
  <pre id="voiceDebug" style="display:none;white-space:pre-wrap;
    font-family:'JetBrains Mono',monospace;font-size:0.62rem;
    color:var(--text-muted);margin-top:14px;padding:10px;
    border:1px solid var(--border);border-radius:8px;
    background:var(--surface2);"></pre>
</div>

<script>
// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
// words[i] = { el, spoken, sentIdx, globalIdx, sentenceEl }
// sentences[i] = { el, words: [wordObj…] }  — a "sentence" is a speech unit:
// one real sentence, or a ≤MAX_UNIT_WORDS chunk of a run-on one.
let words = [], sentences = [];
let curWord = 0;
let playing = false;
let activeUtterance = null;
let curBookId = null;
let speechRate = parseFloat(localStorage.getItem('vox_speed') || '1.0');
let fontSize   = parseInt(localStorage.getItem('vox_fontSize') || '17', 10);
let currentTheme = localStorage.getItem('vox_theme') || 'dark';
let synth = window.speechSynthesis;
let pendingRestartTimer = null;
let posSliderActive = false;

const MAX_UNIT_WORDS = 50;

// iOS Web Speech needs a buffer after cancel() before a new utterance.
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const VOICE_SWITCH_DELAY = IS_IOS ? 300 : 40;

// ════ WEBKIT RATE MAP ════════════════════
// Safari (iOS + macOS) routes Web Speech through AVSpeechSynthesizer,
// which maps rate 1→2 onto default→max (several times normal speed).
// Chrome maps linearly. We compress the slider value on WebKit only,
// using a calibration table tuned from on-device WPM measurements.
const IS_WEBKIT = IS_IOS || (/AppleWebKit/.test(navigator.userAgent) && !/Chrome|Edg/.test(navigator.userAgent));
const WEBKIT_RATE_TABLE = [[1.0, 1.0], [1.5, 1.12], [2.0, 1.25], [2.5, 1.4], [3.0, 1.6]];
function engineRate(sliderRate) {
  if (!IS_WEBKIT || sliderRate <= 1) return sliderRate;
  const T = WEBKIT_RATE_TABLE;
  for (let i = 1; i < T.length; i++) {
    if (sliderRate <= T[i][0]) {
      const t = (sliderRate - T[i - 1][0]) / (T[i][0] - T[i - 1][0]);
      return T[i - 1][1] + t * (T[i][1] - T[i - 1][1]);
    }
  }
  return T[T.length - 1][1];
}

let wantPlaying = false;
let resumeOnReturn = false;
let measuredWpm = null;
let lastWpmRate = null;
let lastWpmVoice = null;
let lastHighlightWord = null;
let lastHighlightSentence = null;
let draftSaveTimer = null;
let newDraft = false;

// ════ BACKGROUND KEEP-ALIVE (experimental) ═
const KEEPALIVE = true;
let keepAliveEl = null;
if (KEEPALIVE) {
  const sr = 8000, sec = 1, ch = 1;
  const numSamples = sr * sec;
  const dataSize = numSamples * ch * 2;
  const buf = new ArrayBuffer(44 + dataSize);
  const dv = new DataView(buf);
  const ws = (off, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(off + i, s.charCodeAt(i)); };
  ws(0, 'RIFF');
  dv.setUint32(4, 36 + dataSize, true);
  ws(8, 'WAVE');
  ws(12, 'fmt ');
  dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true);
  dv.setUint16(22, ch, true);
  dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * ch * 2, true);
  dv.setUint16(32, ch * 2, true);
  dv.setUint16(34, 16, true);
  ws(36, 'data');
  dv.setUint32(40, dataSize, true);
  keepAliveEl = document.createElement('audio');
  keepAliveEl.id = 'keepAlive';
  keepAliveEl.loop = true;
  keepAliveEl.setAttribute('playsinline', '');
  keepAliveEl.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  document.body.appendChild(keepAliveEl);
}
function startKeepAlive() {
  if (KEEPALIVE && keepAliveEl) keepAliveEl.play().catch(() => {});
  if (KEEPALIVE && 'mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
}
function stopKeepAlive() {
  if (KEEPALIVE && keepAliveEl) keepAliveEl.pause();
  if (KEEPALIVE && 'mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
}

function scheduleRestart(idx, delayMs) {
  if (pendingRestartTimer) clearTimeout(pendingRestartTimer);
  pendingRestartTimer = setTimeout(() => {
    pendingRestartTimer = null;
    if (wantPlaying) speakFrom(idx);
  }, delayMs);
}
function cancelPendingRestart() {
  if (pendingRestartTimer) { clearTimeout(pendingRestartTimer); pendingRestartTimer = null; }
}
// ════ STALL WATCHDOG ═════════════════════
// Engines sometimes swallow an utterance (audio interruption, lock screen,
// daemon hiccup): no onend, no error — the UI sits on "Playing…" in silence.
// Track progress events; if none arrive in time, re-speak from curWord.
const STALL_MS = 6000;
const MAX_STALL_RETRIES = 3;
let lastSpeechProgress = 0;
let stallRetries = 0;
setInterval(() => {
  if (!playing || !wantPlaying || !activeUtterance || pendingRestartTimer) return;
  if (performance.now() - lastSpeechProgress < activeUtterance._stallLimit) return;
  if (++stallRetries > MAX_STALL_RETRIES) {
    pauseReading();
    setStatus(IS_WEBKIT ? 'Speech engine stuck — close and reopen the tab, then tap play'
                         : 'Speech engine stuck — quit the browser (⌘Q) and reopen, then tap play', 'paused');
    return;
  }
  setStatus('Reconnecting speech…', 'playing');
  restartAt(curWord, VOICE_SWITCH_DELAY);
}, 1000);

function restartAt(g, delayMs) {
  cancelPendingRestart();
  activeUtterance = null;
  synth.cancel();
  scheduleRestart(g, delayMs);
}

// ════════════════════════════════════════
// DRAWER
// ════════════════════════════════════════
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function toggleDrawer() {
  if (document.getElementById('drawer').classList.contains('open')) closeDrawer();
  else openDrawer();
}
function newEntry() {
  newDraft = true;
  openDrawer();
  document.getElementById('textInput').value = '';
  clearMetaInputs();
  try { localStorage.removeItem('vox_text'); } catch (e) {}
  setTimeout(() => document.getElementById('textInput').focus(), 350);
}

// ════════════════════════════════════════
// VOICES — fixed 3-voice grid
// ════════════════════════════════════════
// The grid ALWAYS shows these three. Whether each is selectable depends on
// what this device's OS exposes to the browser (it differs per device and
// can't be changed from JS): iOS hides Nicky/Aaron from ALL web apps;
// current macOS doesn't ship Aaron at all. Add ?debug=1 to dump raw voices.
const PREFERRED = [
  { name: 'Nicky',    gender: '♀', color: '#e87cb0', bg: '#4a1e35' },
  { name: 'Samantha', gender: '♀', color: '#4f9de8', bg: '#1a3050' },
  { name: 'Aaron',    gender: '♂', color: '#6dbf7c', bg: '#1a3828' },
];
let voiceMap = {};   // name -> best matching SpeechSynthesisVoice
let selectedVoiceName = localStorage.getItem('vox_voice_name') || '';

function voiceQuality(v) {
  const s = (v.voiceURI + ' ' + v.name).toLowerCase();
  if (s.includes('premium'))  return 3;
  if (s.includes('enhanced')) return 2;
  return 1;
}

function refreshVoices() {
  const all = synth.getVoices();
  if (!all.length) return false;

  if (/[?&]debug/.test(location.search)) {
    const dbg = document.getElementById('voiceDebug');
    dbg.style.display = 'block';
    dbg.textContent = `RAW VOICES EXPOSED (${all.length}):\n` +
      all.map(v => `• ${v.name} | ${v.lang} | local:${v.localService}`).join('\n');
  }

  voiceMap = {};
  PREFERRED.forEach(p => {
    const matches = all.filter(v => v.name.split(' (')[0] === p.name && /^en/i.test(v.lang));
    if (matches.length) {
      matches.sort((a, b) => voiceQuality(b) - voiceQuality(a));
      voiceMap[p.name] = matches[0];
    }
  });

  if (!voiceMap[selectedVoiceName]) {
    selectedVoiceName = PREFERRED.map(p => p.name).find(n => voiceMap[n]) || '';
  }
  renderVoiceGrid();
  return true;
}

function initVoices() {
  if (refreshVoices()) return;
  synth.onvoiceschanged = () => { refreshVoices(); };
  setTimeout(() => { if (!Object.keys(voiceMap).length) refreshVoices(); }, 1000);
}

function unavailReason(name) {
  if (IS_IOS) return 'iPhone hides it from web apps';
  if (name === 'Aaron') return 'macOS no longer offers it';
  return 'Not installed on this Mac';
}
function unavailDetail(name) {
  if (IS_IOS) return name + ' works in iOS Speak Selection, but Apple blocks it for ALL web apps. Use Samantha here, or Speak Selection in Obsidian for ' + name + '.';
  if (name === 'Aaron') return 'Aaron was removed from macOS — System Settings has nothing to download. It returns automatically if Apple ever ships it again.';
  return name + ': download it in System Settings → Accessibility → Spoken Content → Manage Voices, then fully restart the browser.';
}

function renderVoiceGrid() {
  const grid = document.getElementById('voiceGrid');
  grid.innerHTML = '';
  let anyAvailable = false;
  PREFERRED.forEach(p => {
    const available = !!voiceMap[p.name];
    if (available) anyAvailable = true;
    const div = document.createElement('div');
    div.className = 'voice-option'
      + (available ? '' : ' unavailable')
      + (p.name === selectedVoiceName ? ' selected' : '');
    div.innerHTML = `
      <div class="voice-avatar" style="background:${p.bg};color:${p.color}">${p.gender}</div>
      <div class="voice-info">
        <div class="voice-name">${p.name}</div>
        <span class="voice-tag">${available ? 'Ready' : unavailReason(p.name)}</span>
      </div>`;
    div.addEventListener('click', () => selectVoice(p.name));
    grid.appendChild(div);
  });
  const note = document.getElementById('voiceNote');
  if (!anyAvailable) {
    note.style.display = 'block';
    note.textContent = 'None of your 3 voices exist on this device — using the system default voice.';
  } else {
    note.style.display = 'none';
  }
}

function selectVoice(name) {
  if (!voiceMap[name]) {
    setStatus(unavailDetail(name), '');
    return;
  }
  selectedVoiceName = name;
  measuredWpm = null;
  try { localStorage.setItem('vox_voice_name', name); } catch (e) {}
  renderVoiceGrid();
  if (wantPlaying) restartAt(curWord, VOICE_SWITCH_DELAY);
}

function getSelectedVoice() { return voiceMap[selectedVoiceName] || null; }

initVoices();

// ════════════════════════════════════════
// LIBRARY — books persisted in localStorage
// ════════════════════════════════════════
function getBooks() {
  try { return JSON.parse(localStorage.getItem('vox_books') || '[]'); }
  catch (e) { return []; }
}
function saveBooks(books) {
  try { localStorage.setItem('vox_books', JSON.stringify(books)); return true; }
  catch (e) { return false; }
}
function getPos(id) {
  return parseInt(localStorage.getItem('vox_pos_' + id) || '0', 10);
}
function savePos() {
  if (!curBookId) return;
  try { localStorage.setItem('vox_pos_' + curBookId, curWord); } catch (e) {}
}
function makeTitle(text) {
  const line = text.split('\n').find(l => l.trim()) || 'Untitled';
  return line.replace(/[#*_`>\[\]|]/g, '').trim().slice(0, 42) || 'Untitled';
}

function clearMetaInputs() {
  document.getElementById('titleInput').value = '';
  document.getElementById('groupInput').value = '';
}
// Title/group typed in the paste area; empty fields mean "leave as is".
function applyMetaInputs(book) {
  const t = document.getElementById('titleInput').value.trim();
  const g = document.getElementById('groupInput').value.trim();
  if (t) { book.title = t.slice(0, 120); book.customTitle = true; }
  if (g) book.group = g.slice(0, 60);
  clearMetaInputs();
}

function getCollapsed() {
  try { return new Set(JSON.parse(localStorage.getItem('vox_collapsed') || '[]')); }
  catch (e) { return new Set(); }
}
function toggleGroup(name) {
  const c = getCollapsed();
  c.has(name) ? c.delete(name) : c.add(name);
  try { localStorage.setItem('vox_collapsed', JSON.stringify([...c])); } catch (e) {}
  renderLibrary();
}

let editingBookId = null;

function renderLibrary() {
  const list = document.getElementById('libList');
  const q = document.getElementById('libSearch').value.trim().toLowerCase();
  const books = getBooks();
  list.innerHTML = '';

  const groupNames = [...new Set(books.map(b => b.group).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b));
  const dl = document.getElementById('groupList');
  dl.innerHTML = '';
  groupNames.forEach(g => { const o = document.createElement('option'); o.value = g; dl.appendChild(o); });

  const shown = q
    ? books.filter(b => (b.title + ' ' + (b.group || '') + ' ' + b.text).toLowerCase().includes(q))
    : books;
  if (!shown.length) {
    list.innerHTML = `<div class="lib-empty">${q ? 'No matches.' : 'No saved texts yet.'}</div>`;
    return;
  }

  const byGroup = new Map();
  shown.forEach(b => {
    const g = b.group || '';
    if (!byGroup.has(g)) byGroup.set(g, []);
    byGroup.get(g).push(b);
  });
  const order = groupNames.filter(g => byGroup.has(g));
  if (byGroup.has('')) order.push('');
  const collapsed = getCollapsed();
  const showHeads = groupNames.length > 0;

  order.forEach(g => {
    const sec = document.createElement('div');
    sec.className = 'grp' + (showHeads && !q && collapsed.has(g) ? ' collapsed' : '');
    const items = byGroup.get(g).sort((a, b) => (b.opened || b.added) - (a.opened || a.added));
    if (showHeads) {
      const head = document.createElement('button');
      head.className = 'grp-head';
      head.innerHTML = `<span class="grp-caret">▾</span><span class="grp-name"></span><span class="grp-count">${items.length}</span>`;
      head.querySelector('.grp-name').textContent = g || 'Ungrouped';
      head.addEventListener('click', () => toggleGroup(g));
      sec.appendChild(head);
    }
    const row = document.createElement('div');
    row.className = 'lib-row';
    items.forEach(b => row.appendChild(bookChip(b)));
    sec.appendChild(row);
    list.appendChild(sec);
  });
}

function bookChip(b) {
  const frag = document.createDocumentFragment();
  const pct = Math.min(100, Math.round((getPos(b.id) / (b.words || 1)) * 100));
  const chip = document.createElement('div');
  chip.className = 'book-chip' + (b.id === curBookId ? ' active' : '');
  chip.innerHTML = `
    <span class="chip-title"></span>
    <span class="chip-pct">${pct}%</span>
    <button class="chip-more" title="Rename, group, delete">⋯</button>`;
  chip.querySelector('.chip-title').textContent = b.title;
  chip.title = b.title;
  chip.addEventListener('click', () => openBook(b.id));
  chip.querySelector('.chip-more').addEventListener('click', (ev) => {
    ev.stopPropagation();
    editingBookId = editingBookId === b.id ? null : b.id;
    renderLibrary();
  });
  frag.appendChild(chip);
  if (editingBookId === b.id) frag.appendChild(editPanel(b));
  return frag;
}

function editPanel(b) {
  const p = document.createElement('div');
  p.className = 'chip-edit';
  p.innerHTML = `
    <input class="meta-input e-title" placeholder="Title" autocomplete="off">
    <input class="meta-input e-group" list="groupList" placeholder="Group (blank = ungrouped)" autocomplete="off">
    <div class="chip-edit-btns">
      <button class="save">Save</button><button class="cancel">Cancel</button><button class="del">Delete</button>
    </div>`;
  const ti = p.querySelector('.e-title'), gi = p.querySelector('.e-group');
  ti.value = b.title; gi.value = b.group || '';
  const save = () => {
    const books = getBooks();
    const book = books.find(x => x.id === b.id);
    if (!book) return;
    const t = ti.value.trim();
    if (t && t !== book.title) { book.title = t.slice(0, 120); book.customTitle = true; }
    else if (!t) { book.title = makeTitle(book.text); book.customTitle = false; }
    const g = gi.value.trim().slice(0, 60);
    if (g) book.group = g; else delete book.group;
    if (!saveBooks(books)) { setStatus('Storage full — changes not saved', ''); return; }
    if (book.id === curBookId && KEEPALIVE && 'mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: book.title, artist: 'Vox Reader' });
    }
    editingBookId = null;
    renderLibrary();
  };
  const cancel = () => { editingBookId = null; renderLibrary(); };
  p.querySelector('.save').addEventListener('click', save);
  p.querySelector('.cancel').addEventListener('click', cancel);
  p.querySelector('.del').addEventListener('click', (ev) => deleteBook(b.id, ev));
  p.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    else if (e.key === 'Escape') { e.stopPropagation(); cancel(); }
  });
  setTimeout(() => { ti.focus(); ti.select(); }, 0);
  return p;
}

function deleteBook(id, ev) {
  ev.stopPropagation();
  const book = getBooks().find(b => b.id === id);
  if (!confirm('Delete "' + (book ? book.title : 'this book') + '" from the library?')) return;
  saveBooks(getBooks().filter(b => b.id !== id));
  try { localStorage.removeItem('vox_pos_' + id); } catch (e) {}
  if (curBookId === id) {
    curBookId = null;
    try { localStorage.removeItem('vox_last_book'); } catch (e) {}
  }
  editingBookId = null;
  renderLibrary();
}

// "Load Text" button: dedupes, updates in place, or creates a new book.
function loadText() {
  const raw = document.getElementById('textInput').value;
  if (!raw.trim()) return;
  const books = getBooks();
  const existing = books.find(b => b.text === raw);
  if (existing) {
    applyMetaInputs(existing);
    saveBooks(books);
    openBook(existing.id);
    newDraft = false;
    return;
  }
  if (curBookId && !newDraft) {
    const book = books.find(b => b.id === curBookId);
    if (book && makeTitle(raw) === makeTitle(book.text)) {
      book.text = raw;
      if (!book.customTitle) book.title = makeTitle(raw);
      applyMetaInputs(book);
      buildReader(raw);
      book.words = words.length;
      if (!saveBooks(books)) {
        setStatus('Storage full — book not saved', '');
        return;
      }
      try { localStorage.setItem('vox_pos_' + book.id, '0'); } catch (e) {}
      finishOpen(book, 0);
      setStatus('Updated "' + book.title + '"', '');
      newDraft = false;
      return;
    }
  }
  const book = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    title: makeTitle(raw),
    text: raw,
    words: 0,
    added: Date.now(),
  };
  applyMetaInputs(book);
  books.unshift(book);
  curBookId = book.id;
  buildReader(raw);
  book.words = words.length;
  if (!saveBooks(books)) {
    setStatus('Storage full — book not saved', '');
    curBookId = null;
    return;
  }
  finishOpen(book, 0);
  newDraft = false;
}

function openBook(id) {
  const books = getBooks();
  const book = books.find(b => b.id === id);
  if (!book) return;
  book.opened = Date.now();
  saveBooks(books);
  stopReading();
  curBookId = id;
  newDraft = false;
  clearMetaInputs();
  document.getElementById('textInput').value = book.text;
  buildReader(book.text);
  const pos = getPos(id);
  finishOpen(book, (pos >= 0 && pos < words.length) ? pos : 0);
}

function finishOpen(book, startWord) {
  try { localStorage.setItem('vox_last_book', book.id); } catch (e) {}
  if (KEEPALIVE && 'mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: book.title, artist: 'Vox Reader' });
  }
  curWord = startWord;
  if (words.length) {
    highlightWord(curWord);
    scrollToCurrent();
  }
  updatePositionSlider(); updateProgress(); updateReadTime(); updateMeta();
  renderLibrary();
  closeDrawer();
  const pct = words.length ? Math.round((curWord / Math.max(words.length - 1, 1)) * 100) : 0;
  setStatus(curWord > 0 ? 'Resumed "' + book.title + '" at ' + pct + '%' : 'Loaded "' + book.title + '"', '');
}

// ════════════════════════════════════════
// TEXT → READER DOM (verbatim — the pane
// shows EXACTLY the pasted text; nothing
// is stripped or altered for display)
// ════════════════════════════════════════
// Sentence split that keeps every character: pieces concatenate back to the
// original paragraph. Abbreviations + decimals protected from splitting.
function splitSentences(text) {
  const abbrevPat = /\b(Mr|Mrs|Ms|Dr|Prof|Sr|Jr|St|vs|etc|approx|dept|govt|incl|Vol|Capt|Col|Cpl|Gen|Pvt|Sgt|Lt|Ave|Blvd|Rd|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Oct|Nov|Dec|e\.g|i\.e)\./g;
  const safe = text.replace(abbrevPat, m => m.slice(0, -1) + '\x00')
                   .replace(/(\d)\.(\d)/g, '$1\x00$2');
  return safe.replace(/(\n)(?=[ \t]*\S)/g, '$1\x01')
             .replace(/([.!?…]+["'»‘’“”)\]]*)(\s+|$)/g, '$1$2\x01')
             .split('\x01')
             .map(s => s.replace(/\x00/g, '.'))
             .filter(s => s.length);
}
// What gets SPOKEN for a displayed word: markdown decoration characters are
// silently skipped in speech only. Display is never modified.
const DECOR = '[*_`#>|~\\[\\]()]';
const STRIP_DECOR = new RegExp(`(?<![\\p{L}\\p{N}])${DECOR}+|${DECOR}+(?![\\p{L}\\p{N}])`, 'gu');
function spokenForm(tok) {
  const linkMatch = tok.match(/^\[([^\]]+)\]\([^)]*\)$/);
  if (linkMatch) return linkMatch[1].replace(/(\d):(\d)/g, '$1 $2').trim();
  let s = tok.replace(STRIP_DECOR, '');
  return s.replace(/(\d):(\d)/g, '$1 $2').trim();
}

function buildReader(text) {
  stopReading();
  const pane = document.getElementById('readerPane');
  pane.innerHTML = '';
  words = []; sentences = [];
  curWord = 0;

  const hasWordChar = /[\p{L}\p{N}]/u;
  const units = [];
  const paras = text.split(/\n\s*\n/).filter(p => p.trim());

  paras.forEach(para => {
    const paraDiv = document.createElement('div');
    paraDiv.className = 'para';

    splitSentences(para).forEach(piece => {
      let unit = { el: document.createElement('span'), words: [] };
      unit.el.className = 'sentence';
      paraDiv.appendChild(unit.el);
      units.push(unit);

      piece.split(/(\s+)/).forEach(tok => {
        if (!tok) return;
        if (/^\s+$/.test(tok)) {
          unit.el.appendChild(document.createTextNode(tok));
          return;
        }
        // Cap unit length so a run-on "sentence" never becomes a giant utterance
        if (unit.words.length >= MAX_UNIT_WORDS) {
          unit = { el: document.createElement('span'), words: [] };
          unit.el.className = 'sentence';
          paraDiv.appendChild(unit.el);
          units.push(unit);
        }
        if (hasWordChar.test(tok)) {
          const w = document.createElement('span');
          w.className = 'word';
          w.textContent = tok;
          const obj = {
            el: w,
            spoken: spokenForm(tok),
            sentIdx: 0,
            globalIdx: words.length,
            sentenceEl: null,
          };
          w.addEventListener('click', () => seekToWord(obj.globalIdx));
          unit.words.push(obj);
          words.push(obj);
          unit.el.appendChild(w);
        } else {
          unit.el.appendChild(document.createTextNode(tok));
        }
      });
    });

    pane.appendChild(paraDiv);
  });

  sentences = units.filter(u => u.words.length);
  sentences.forEach((s, i) => s.words.forEach(w => { w.sentIdx = i; w.sentenceEl = s.el; }));

  pane.scrollTop = 0;
  if (!words.length) {
    pane.innerHTML = '<div class="reader-empty">No readable words found in that text.</div>';
  }
}

// ════════════════════════════════════════
// PLAYBACK — sentence queue. Each sentence
// is its own short utterance; onend chains
// to the next. Short utterances = reliable
// boundaries, clean pause, no mid-text
// engine death on long documents.
// ════════════════════════════════════════
function togglePlay() {
  if (!words.length) { loadText(); if (!words.length) return; }
  if (wantPlaying) { pauseReading(); return; }
  wantPlaying = true;
  stallRetries = 0;
  startKeepAlive();
  const start = curWord >= words.length ? 0 : curWord;
  speakFrom(start);
}

function speakFrom(g) {
  if (!words.length) return;
  g = Math.max(0, Math.min(g, words.length - 1));
  cancelPendingRestart();
  if (synth.speaking || synth.pending) { activeUtterance = null; synth.cancel(); }
  playing = true;
  setPlayBtn(true);
  setStatus('Playing…', 'playing');
  setCurrentWord(g);
  speakUnit(g);
}

function speakUnit(g) {
  const sIdx = words[g].sentIdx;
  const sent = sentences[sIdx];
  const chunk = sent.words.filter(w => w.globalIdx >= g && w.spoken);
  if (!chunk.length) { advanceFrom(sIdx); return; }

  let text = ''; const starts = [];
  chunk.forEach((w, i) => { if (i) text += ' '; starts.push(text.length); text += w.spoken; });

  const u = new SpeechSynthesisUtterance(text);
  u.rate = engineRate(speechRate);
  const v = getSelectedVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }

  // Before audio starts / between word events: STALL_MS. Voices that emit no
  // boundary events get the whole estimated utterance length plus slack.
  const estMs = chunk.length * 60000 / (150 * speechRate);
  u._stallLimit = STALL_MS;
  u.onboundary = (e) => {
    lastSpeechProgress = performance.now();
    u._stallLimit = STALL_MS;
    if (e.name !== 'word') return;
    let idx = 0;
    for (let i = starts.length - 1; i >= 0; i--) {
      if (starts[i] <= e.charIndex) { idx = i; break; }
    }
    const w = chunk[idx];
    if (w.globalIdx !== curWord) setCurrentWord(w.globalIdx);
  };

  let speakT0 = performance.now();
  const speakWordCount = chunk.length;
  u.onstart = () => {
    speakT0 = lastSpeechProgress = performance.now();
    u._stallLimit = Math.max(STALL_MS, estMs * 2 + 3000);
    if (stallRetries) setStatus('Playing…', 'playing');
  };

  u.onend = () => {
    if (u !== activeUtterance || !playing) return;

    if (speakWordCount >= 4) {
      const elapsed = performance.now() - speakT0;
      if (elapsed >= 1000) {
        const wpm = speakWordCount / (elapsed / 60000);
        if (speechRate !== lastWpmRate || selectedVoiceName !== lastWpmVoice) {
          measuredWpm = wpm;
          lastWpmRate = speechRate;
          lastWpmVoice = selectedVoiceName;
        } else {
          measuredWpm = measuredWpm != null ? measuredWpm * 0.7 + wpm * 0.3 : wpm;
        }
        updateReadTime();
        if (/[?&]debug/.test(location.search)) {
          const dbg = document.getElementById('voiceDebug');
          dbg.style.display = 'block';
          const line = `slider ${speechRate.toFixed(1)}× → engine ${engineRate(speechRate).toFixed(2)} | measured ${Math.round(wpm)} wpm | avg ${Math.round(measuredWpm)} wpm | ${selectedVoiceName || 'default'}`;
          const parts = dbg.textContent.split('── WPM ──');
          dbg.textContent = parts[0].trimEnd() + '\n── WPM ──\n' + line;
        }
      }
    }

    activeUtterance = null;
    stallRetries = 0;
    advanceFrom(sIdx);
  };
  u.onerror = (e) => {
    if (e.error === 'canceled' || e.error === 'interrupted') return;
    if (u !== activeUtterance) return;
    activeUtterance = null;
    wantPlaying = false;
    playing = false;
    setPlayBtn(false);
    stopKeepAlive();
    setStatus('Speech error (' + (e.error || 'unknown') + ') — tap play to continue', '');
    savePos();
  };

  activeUtterance = u;
  lastSpeechProgress = performance.now();
  if (synth.paused) synth.resume();  // a paused engine queues silently
  synth.speak(u);
}

function advanceFrom(sIdx) {
  if (!playing) return;
  const next = sentences[sIdx + 1];
  if (!next) { finishedReading(); return; }
  const g = next.words[0].globalIdx;
  setCurrentWord(g);
  speakUnit(g);
}

function finishedReading() {
  wantPlaying = false;
  playing = false;
  activeUtterance = null;
  stopKeepAlive();
  curWord = words.length;
  clearHighlights();
  setPlayBtn(false);
  setStatus('Finished', '');
  updateProgress(100);
  updateReadTime();
  savePos();
}

function pauseReading() {
  wantPlaying = false;
  cancelPendingRestart();
  activeUtterance = null;
  synth.cancel();
  playing = false;
  setPlayBtn(false);
  stopKeepAlive();
  setStatus('Paused', 'paused');
  savePos();
}

function stopReading(resetHL = true) {
  wantPlaying = false;
  cancelPendingRestart();
  activeUtterance = null;
  synth.cancel();
  playing = false;
  if (resetHL) clearHighlights();
  setPlayBtn(false);
  stopKeepAlive();
  setStatus('Ready', '');
}

function restartBook() {
  if (!words.length) return;
  seekToWord(0);
  document.getElementById('readerPane').scrollTop = 0;
}

function skipSentence(dir) {
  if (!words.length) return;
  const atEnd = curWord >= words.length;
  let sIdx = atEnd ? sentences.length - 1 : words[curWord].sentIdx;
  const sentStart = sentences[sIdx].words[0].globalIdx;
  // Back from mid-sentence goes to the start of the CURRENT sentence first
  if (!(dir < 0 && !atEnd && curWord > sentStart)) {
    sIdx = Math.max(0, Math.min(sentences.length - 1, sIdx + dir));
  }
  seekToWord(sentences[sIdx].words[0].globalIdx);
}

// ════════════════════════════════════════
// HIGHLIGHT + POSITION
// ════════════════════════════════════════
function setCurrentWord(g) {
  curWord = g;
  highlightWord(g);
  updatePositionSlider(); updateProgress(); updateReadTime();
  if (curBookId && g % 10 === 0) savePos();
}

function highlightWord(idx) {
  if (!words[idx]) return;
  const { el, sentenceEl } = words[idx];
  clearHighlights();
  el.classList.add('active-word');
  sentenceEl.classList.add('active-sentence');
  lastHighlightWord = el;
  lastHighlightSentence = sentenceEl;
  const pane = document.getElementById('readerPane');
  const elTop = el.offsetTop;
  const elBot = elTop + el.offsetHeight;
  const viewTop = pane.scrollTop;
  const viewBot = viewTop + pane.clientHeight;
  const margin = 60;
  if (elTop < viewTop + margin || elBot > viewBot - margin) {
    pane.scrollTo({ top: elTop - pane.clientHeight * 0.4, behavior: 'smooth' });
  }
}

function scrollToCurrent() {
  const w = words[Math.min(curWord, words.length - 1)];
  if (!w) return;
  const pane = document.getElementById('readerPane');
  pane.scrollTop = Math.max(0, w.el.offsetTop - pane.clientHeight * 0.3);
}

function clearHighlights() {
  if (lastHighlightSentence) { lastHighlightSentence.classList.remove('active-sentence'); lastHighlightSentence = null; }
  if (lastHighlightWord) { lastHighlightWord.classList.remove('active-word'); lastHighlightWord = null; }
}

function seekToWord(g) {
  if (!words.length) return;
  g = Math.max(0, Math.min(g, words.length - 1));
  const was = wantPlaying;
  if (synth.speaking || synth.pending) {
    activeUtterance = null;
    synth.cancel();
  }
  setCurrentWord(g);
  savePos();
  if (was) restartAt(g, 150);
}

function seekPositionDisplay(pct) {
  document.getElementById('posVal').textContent = Math.round(pct) + '%';
  applyPositionGradient(pct);
}
function seekPositionCommit(pct) {
  if (!words.length) return;
  seekToWord(Math.round((pct / 100) * (words.length - 1)));
}

function updatePositionSlider() {
  if (!words.length || posSliderActive) return;
  const pct = (Math.min(curWord, words.length) / Math.max(words.length - 1, 1)) * 100;
  document.getElementById('posSlider').value = pct;
  document.getElementById('posVal').textContent = Math.round(Math.min(pct, 100)) + '%';
  applyPositionGradient(Math.min(pct, 100));
}

function updateProgress(force) {
  const pct = force !== undefined ? force
    : words.length ? (Math.min(curWord, words.length) / Math.max(words.length - 1, 1)) * 100 : 0;
  document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
}

// ════════════════════════════════════════
// META / READ TIME
// ════════════════════════════════════════
document.getElementById('textInput').addEventListener('input', () => {
  updateMeta();
  if (draftSaveTimer) clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(() => {
    const v = document.getElementById('textInput').value;
    try { localStorage.setItem('vox_text', v); } catch (e) {}
  }, 300);
});

function updateMeta() {
  const wc = words.length ||
    (document.getElementById('textInput').value.trim()
      ? document.getElementById('textInput').value.trim().split(/\s+/).length : 0);
  document.getElementById('wordCount').textContent = wc.toLocaleString() + ' words';
  updateReadTime();
}

function updateReadTime() {
  let wc;
  if (words.length) {
    wc = Math.max(words.length - curWord, 0);
  } else {
    const t = document.getElementById('textInput').value.trim();
    wc = t ? t.split(/\s+/).length : 0;
  }
  const BASE_WPM = 175;
  const effectiveWpm = measuredWpm || (BASE_WPM * speechRate);
  const mins = Math.ceil(wc / effectiveWpm);
  document.getElementById('readTime').textContent = '~' + mins + ' min';
}

// ════════════════════════════════════════
// SPEED / FONT / THEME / STATUS / PASTE
// ════════════════════════════════════════
function applySpeedGradient(val) {
  const pct = ((val - 0.5) / 2.5) * 100;
  document.getElementById('speedSlider').style.background =
    `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, var(--border) ${pct}%, var(--border) 100%)`;
}
function updateSpeedDisplay(val) {
  speechRate = parseFloat(val);
  document.getElementById('speedVal').textContent = speechRate.toFixed(1) + '×';
  applySpeedGradient(val);
  updateReadTime();
}
function updateSpeedCommit(val) {
  speechRate = parseFloat(val);
  measuredWpm = null;
  try { localStorage.setItem('vox_speed', speechRate); } catch (e) {}
  if (wantPlaying) restartAt(curWord, 150);
}

function changeFontSize(delta) {
  fontSize = Math.max(12, Math.min(30, fontSize + delta));
  document.getElementById('readerPane').style.fontSize = fontSize + 'px';
  try { localStorage.setItem('vox_fontSize', fontSize); } catch (e) {}
}

function setTheme(name, el) {
  currentTheme = name;
  document.body.classList.remove('theme-light', 'theme-sepia', 'theme-slate', 'theme-forest', 'theme-ocean');
  if (name !== 'dark') document.body.classList.add('theme-' + name);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  try { localStorage.setItem('vox_theme', name); } catch (e) {}
}

function setStatus(text, state) {
  document.getElementById('statusText').textContent = text;
  document.getElementById('statusDot').className = 'status-dot' + (state ? ' ' + state : '');
}
function setPlayBtn(p) {
  const btn = document.getElementById('playBtn');
  btn.textContent = p ? '⏸' : '▶';
  btn.classList.toggle('playing', p);
}

function applyPositionGradient(pct) {
  document.getElementById('posSlider').style.background =
    `linear-gradient(to right, var(--accent) 0%, var(--accent) ${pct}%, var(--border) ${pct}%, var(--border) 100%)`;
}

// ════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowLeft')  { skipSentence(-1); }
  else if (e.key === 'ArrowRight') { skipSentence(1); }
  else if (e.key === 'r' || e.key === 'R') { restartBook(); }
});

// Save reading position and handle background/resume on iPhone
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    savePos();
    resumeOnReturn = wantPlaying;
  } else {
    const engineActive = synth.speaking || synth.pending;
    if (resumeOnReturn && (IS_IOS || !engineActive)) {
      startKeepAlive();
      restartAt(curWord, VOICE_SWITCH_DELAY);
    } else if (wantPlaying && !engineActive) {
      wantPlaying = false;
      playing = false;
      setPlayBtn(false);
      stopKeepAlive();
      setStatus('Paused (backgrounded)', 'paused');
      savePos();
    }
    resumeOnReturn = false;
  }
});
window.addEventListener('pagehide', savePos);

if (KEEPALIVE && 'mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => { if (!wantPlaying) togglePlay(); });
  navigator.mediaSession.setActionHandler('pause', () => pauseReading());
  navigator.mediaSession.setActionHandler('nexttrack', () => skipSentence(1));
  navigator.mediaSession.setActionHandler('previoustrack', () => skipSentence(-1));
}

// ════════════════════════════════════════
// INIT — restore persisted state
// ════════════════════════════════════════
(function () {
  setTheme(currentTheme, document.querySelector('.theme-btn.' + currentTheme));
  document.getElementById('readerPane').style.fontSize = fontSize + 'px';
  const ss = document.getElementById('speedSlider');
  ss.value = speechRate;
  document.getElementById('speedVal').textContent = speechRate.toFixed(1) + '×';
  applySpeedGradient(speechRate);
  applyPositionGradient(0);

  const ps = document.getElementById('posSlider');
  const begin = () => { posSliderActive = true; };
  const end   = () => { posSliderActive = false; };
  ps.addEventListener('pointerdown', begin);
  ps.addEventListener('pointerup', end);
  ps.addEventListener('pointercancel', end);
  ps.addEventListener('touchstart', begin, { passive: true });
  ps.addEventListener('touchend', end);

  renderLibrary();

  // Reopen the last book at its saved position; else restore unsaved draft
  const lastId = localStorage.getItem('vox_last_book');
  if (lastId && getBooks().some(b => b.id === lastId)) {
    openBook(lastId);
  } else {
    const draft = localStorage.getItem('vox_text');
    if (draft) document.getElementById('textInput').value = draft;
    updateMeta();
  }
})();
</script>
</body>
